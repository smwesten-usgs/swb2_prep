[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swb2-prep"
version = "0.1.0"
description = "Tools for preparing geospatial inputs and control files for the USGS SWB model."
authors = [
    { name = "Steve Westenbroek", email = "smwesten@usgs.gov" }
]
readme = "README.md"
requires-python = ">=3.10"

# Core dependencies needed for your SWB preprocessing workflow.
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "geopandas>=0.13",
    "shapely>=2.0",
    "pyproj>=3.5",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
]

[project.scripts]
# CLI entrypoints: these map to procedural CLI tools located in swb2_prep/cli/
swb2-prep-landuse = "swb2_prep.cli.prep_landuse_input:main"
swb2-prep-awc = "swb2_prep.cli.prep_awc_input:main"
swb2-prep-hsg = "swb2_prep.cli.prep_hsg_input:main"
swb2-prep-d8 = "swb2_prep.cli.prep_d8_flowdir:main"
swb2-prep-control = "swb2_prep.cli.make_swb_control_file:main"

[tool.setuptools.packages.find]
# Include the main package and all subpackages
where = ["."]
include = ["swb2_prep*"]

[tool.setuptools]
# Ensure package data is included (e.g., small test rasters or soil tables)
include-package-data = true
